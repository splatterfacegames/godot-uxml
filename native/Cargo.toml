[package]
name = "godot_uxml_native"
version = "0.1.0"
edition = "2021"
description = "Native core for the godot-uxml addon (cascade, layout, parsers)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7", "safeguards-release-disengaged"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
